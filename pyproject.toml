[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-integration-platform"
version = "0.1.0"
description = "生产级 ETL-Agent 数据集成平台控制面"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    # 凭据加密存储（T-14 Fernet）与 Harness 分离签名（M4 Ed25519）
    "cryptography>=45,<52",
    # 元数据探查驱动（T-11 / T-12）：与 SPEC §2.2 的覆盖清单一一对应
    "clickhouse-connect>=0.8,<1",
    "oracledb>=2.5,<4",
    "pure-sasl>=0.6,<1",
    "pyhive>=0.7,<1",
    "pymysql>=1.1,<2",
    "python-tds>=1.17,<2",
    "thrift>=0.20,<1",
    "thrift-sasl>=0.4,<1",
    # 对象存储（T-16 GAP-02）：MinIO 客户端同时兼容 AWS S3 API
    "minio>=7.2,<8",
    # 显式声明：Minio 构造器的超时只能通过 urllib3 客户端注入，属直接使用
    "urllib3>=2,<3",
    # 受管文件格式（T-16）：CSV/JSON/JSONL/Markdown 用标准库，其余见下
    "defusedxml>=0.7,<1",
    "openpyxl>=3.1,<4",
    "pyarrow>=17,<24",
    "pyorc>=0.9,<1",
    "pypdf>=5,<7",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    # 生成状态机与可恢复中断（T-19）；Checkpoint 落独立库，不代替审批、授权与执行台账
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
    "opentelemetry-instrumentation-celery>=0.58b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
    "opentelemetry-instrumentation-httpx>=0.58b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.58b0,<1",
    "opentelemetry-sdk>=1.37,<2",
    "pydantic-settings>=2.10,<3",
    # langgraph-checkpoint-postgres 走 psycopg（v3），binary 额外项自带 libpq；
    # 控制面业务真相仍用 asyncpg，两者互不影响。
    "psycopg[binary]>=3.2,<4",
    # 真实引擎检查（T-21）：引擎的 REST 接口只收 JSON 配置文档，候选是 HOCON 文本，
    # 转换交给 HOCON 解析器而不是自写的受限读取器 —— 后者「解析成功但内容错了」会让门禁假通过。
    "pyhocon>=0.3,<1",
    # 文件资产上传走 multipart/form-data（T-16）
    "python-multipart>=0.0.20,<1",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.35,<1",
    # 调度表达式（T-23）；SPEC §2.2 指定用 croniter。表达式按 6 段（秒在前）解析，
    # 与 PRD 里 `0 0 2 * * *` 的写法一致，所以调用处要显式 second_at_beginning=True。
    "croniter>=6,<7",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-croniter>=6.2.4.20261006",
    "types-defusedxml>=0.7,<1",
]

[project.scripts]
dip-api = "data_integration_platform.main:run"
dip-worker = "data_integration_platform.worker:run"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/data_integration_platform"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "simulation_l0: 无外部副作用的静态策略、权限与制品攻击仿真",
    "simulation_l1: 仅在模拟器内注入故障、重放、超时和部分成功",
    "simulation_l2: 需要开发 Compose 的真实 MySQL/文件、SeaTunnel 与 Doris 链路",
    "integration: 需要 Compose 起的真实 PostgreSQL / MySQL / MinIO；未启动时整组跳过",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# prototype/ 是设计交付物（原型生成脚本），不属于服务端源码，不纳入本项目的 lint/format 范围。
extend-exclude = ["prototype"]
# 默认 force_exclude=false，显式传路径会绕过 exclude —— 即 `ruff format prototype/` 仍会改到原型脚本。
# 置为 true 让 exclude 对显式路径同样生效，避免误格式化设计交付物。
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "B008",   # FastAPI 官方推荐在参数默认值中使用 Depends。
    "RUF001", # 中文业务文案需要全角标点。
    "RUF002",
    "RUF003",
    "UP047",  # 当前保持 Python 3.12 也易读的 TypeVar 写法。
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["data_integration_platform"]

# Celery 未发布类型声明，`@celery_app.task` 装饰器因此是 untyped；
# 只在任务模块内放宽这一条，任务体本身仍按严格模式检查。
# 逐个列出（mypy 的模式不支持 `*_tasks` 这种部分通配），新增任务模块时同步补上。
[[tool.mypy.overrides]]
module = [
    "data_integration_platform.connection_tasks",
    "data_integration_platform.credential_alert_tasks",
    "data_integration_platform.secret_destruction_tasks",
    "data_integration_platform.secret_migration_tasks",
    "data_integration_platform.secret_rotation_rollback_tasks",
    "data_integration_platform.secret_rotation_tasks",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "celery.*",
    "clickhouse_connect.*",
    "minio.*",
    "openpyxl.*",
    "oracledb.*",
    "pyarrow.*",
    "pyhive.*",
    "pymysql.*",
    "pyhocon.*",
    "pyorc.*",
    "pypdf.*",
    "puresasl.*",
    "pytds.*",
    "thrift.*",
    "thrift_sasl.*",
]
ignore_missing_imports = true
